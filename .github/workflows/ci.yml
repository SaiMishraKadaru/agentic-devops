name: Agentic DevOps CI

on:
  push:
    branches:
      - main
      - feat/agentic-cicd
  pull_request:
  workflow_dispatch:
    inputs:
      db_host:
        description: 'DB_HOST value (leave empty to simulate failure)'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Python syntax check
        run: python -m compileall .

      - name: Remove any existing container
        run: docker rm -f agentic-devops-demo || true

      - name: Build image
        run: docker build -t agentic-devops-demo .

      - name: Run container (fails without DB_HOST)
        id: run_container
        run: |
          if [ -n "${{ github.event.inputs.db_host }}" ]; then
            docker run --name agentic-devops-demo -e DB_HOST="${{ github.event.inputs.db_host }}" agentic-devops-demo
          else
            docker run --name agentic-devops-demo agentic-devops-demo
          fi
      
      - name: Run agent investigation
        if: steps.run_container.outcome == 'failure'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGENT_TASK: "Investigate failure in container agentic-devops-demo on commit ${{ github.sha }}, workflow run ${{ github.run_id }}"
        run: python main.py
